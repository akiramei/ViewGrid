#-------------------------------------------------------------------------------#
#               Qodana analysis is configured by qodana.yaml file               #
#             https://www.jetbrains.com/help/qodana/qodana-yaml.html            #
#-------------------------------------------------------------------------------#

#################################################################################
#              WARNING: Do not store sensitive information in this file,        #
#               as its contents will be included in the Qodana report.          #
#################################################################################
version: "1.0"

#Specify IDE code to run analysis without container (Applied in CI/CD pipeline)
ide: QDNET

#Specify inspection profile for code analysis
profile:
  name: qodana.starter

#Enable inspections
#include:
#  - name: <SomeEnabledInspectionId>

#Disable inspections
exclude:
  # Avalonia Fluent テーマの組み込み Button クラス。 Qodana がテーマ定義を解析できず誤検知。
  - name: Xaml.StyleClassNotFound
  # IValueConverter.Convert/ConvertBack はインターフェースが object? を返すため
  # 個別実装で締めても呼び出し側は ? のまま、 価値が薄い。
  - name: ReturnTypeCanBeNotNullable
    paths:
      - src/ViewGrid.Presentation/Converters
  # Avalonia の axaml ソース生成側パートナーが必要なので partial を外せない。
  - name: PartialTypeWithSinglePart
    paths:
      - src/ViewGrid.Presentation/App.axaml.cs
  # PhotoBoardLayout のランダム化結果が「少しでも違うか」を bitwise で検出する目的。
  # トレランス比較だと検出感度が落ちて誤検知になるため意図的な == / !=。
  - name: CompareOfFloatsByEqualityOperator
    paths:
      - tests/ViewGrid.Core.Tests/Geometry/PhotoBoardLayoutTests.cs
  # 2 色半分割の PNG を作るテストヘルパで int 除算は意図的 (ピクセル境界で半分割)。
  - name: PossibleLossOfFraction
    paths:
      - tests/ViewGrid.Application.Tests/Imaging/SkiaGridImageRendererTests.cs

#Execute shell command before Qodana execution (Applied in CI/CD pipeline)
#bootstrap: sh ./prepare-qodana.sh

#Install IDE plugins before Qodana execution (Applied in CI/CD pipeline)
#plugins:
#  - id: <plugin.id> #(plugin id can be found at https://plugins.jetbrains.com)

# Quality gate. Will fail the CI/CD pipeline if any condition is not met
# severityThresholds - configures maximum thresholds for different problem severities
# testCoverageThresholds - configures minimum code coverage on a whole project and newly added code
# Code Coverage is available in Ultimate and Ultimate Plus plans
#failureConditions:
#  severityThresholds:
#    any: 15
#    critical: 5
#  testCoverageThresholds:
#    fresh: 70
#    total: 50
