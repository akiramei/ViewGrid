# cross_capability_consistency (★ 候補c の主目的: 境界を両側から張る)
# ────────────────────────────────────────────────────────────────────────
cross_capability_consistency:
  with: GRID_COMPOSITION.as-built.v0.1.yaml
  checks:
    - "GRID.does_not_own『画像(バリアント)の意味解釈 = 共有特性(Scaling/Crop/Transform/Alignment/Regions)の生成・適用 (IMAGE_VARIANT)』 ↔ 本 BOM.owns が同特性を所有。境界一致 (gap/overlap なし)。"
    - "GRID.does_not_own『画像同一性・重複検出 (ImageAsset.FileHash)』 ↔ 本 BOM.decision_ownership.image_identity が所有 (IR-02)。一致。"
    - "Fork straddle: GRID 側=配置 CopyId 付け替え / 本 BOM 側=新バリアント生成。両側で同一 UseCase を別責務として記述。一致 + 共通 finding (Regions 落ち=IO-3) を両側に記録 → ★ 2026-06-01 是正済 (IO-1 に続く research→実コード 2 例目: BOM が両側突合で発見した latent bug を production 修正 + anchor test 固定)。"
    - "crop ライブプレビュー straddle: GRID 側 push は overreach でない (GRID O-2 / 本 IO-2)。意味の漏れは本 BOM 側 EffectiveCropPreview (IO-1) だった → ★ 2026-06-01 是正済 (IO-1=mitigated): 優先判定を Core CropFraction.ResolveEffective へ単一源化、EffectiveCropPreview も委譲 (draft 入力・sync 性は保持)。境界の *どちら側に* overreach があるかを両側 BOM で確定し、研究成果 (F-P10/F-P12 の resolver 仕様 pin) を実コード是正へ接続した実例。"
    - "F-P2 候補C (Place が画像アスペクトから占有導出) の越境判定の裏付け: 『画像形状の解釈』は本 BOM.owns (image_identity/shared_property) であり GRID は does_not_own。両側 BOM が揃ったことで、あの越境が *どの Capability の所有を侵したか* が双方向に確定した。"

